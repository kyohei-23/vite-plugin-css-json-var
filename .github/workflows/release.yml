name: Release package

on:
  push:
    branches:
      - main
    paths:
      - packages/vite-plugin-css-json-var/src/**
      - packages/vite-plugin-css-json-var/vite.config.ts
      - packages/vite-plugin-css-json-var/package.json
      - packages/vite-plugin-css-json-var/tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "!packages/vite-plugin-css-json-var/src/**/*.test.ts"
      - "!packages/vite-plugin-css-json-var/src/**/*.spec.ts"
      - "!packages/vite-plugin-css-json-var/**/__tests__/**"
      - "!packages/vite-plugin-css-json-var/**/tests/**"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vite-plugin-css-json-var
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        working-directory: .
        run: vp install --frozen-lockfile

      - name: Bump package version
        run: npm version patch --no-git-tag-version

      - name: Build package
        run: vp run build

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create and push release tag
        working-directory: .
        run: |
          cd packages/vite-plugin-css-json-var
          version=$(node -p "require('./package.json').version")
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json
          git commit -m "chore: release v${version}"
          git tag "v${version}"
          git push origin HEAD:main --follow-tags
